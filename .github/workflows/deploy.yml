name: Deploy landings to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  descubrir:
    runs-on: ubuntu-latest
    outputs:
      proyectos: ${{ steps.matriz.outputs.proyectos }}
    steps:
      - uses: actions/checkout@v4
      - id: matriz
        # Solo las landings bajo projects/. El wrangler.jsonc de la raíz (la web
        # personal en Astro) queda deliberadamente fuera: necesita un build previo
        # y usa el secreto CLOUDFLARE_API_TOKEN a secas, no uno por carpeta.
        # Lo despliega deploy-site.yml.
        run: |
          echo "proyectos=$(find ./projects -name wrangler.jsonc -printf '%h\n' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: descubrir
    if: needs.descubrir.outputs.proyectos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proyecto: ${{ fromJson(needs.descubrir.outputs.proyectos) }}
    steps:
      - uses: actions/checkout@v4

      # Las landings son HTML plano: no hay nada que construir aquí, así que no
      # se instala el proyecto. `npm ci` traía 587 MB de Astro, Tailwind y sharp
      # para acabar ejecutando wrangler. La versión sale del lockfile para que
      # siga siendo exactamente la misma que en local.
      - id: wrangler
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: secreto
        run: |
          slug="${{ matrix.proyecto }}"
          slug="${slug#./projects/}"
          echo "clave=CLOUDFLARE_API_TOKEN_$(echo "$slug" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets[steps.secreto.outputs.clave] }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.proyecto }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
