name: Deploy landings to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  descubrir:
    runs-on: ubuntu-latest
    outputs:
      proyectos: ${{ steps.matriz.outputs.proyectos }}
    steps:
      - uses: actions/checkout@v4
      - id: matriz
        # Solo las landings bajo projects/. El wrangler.jsonc de la raíz (la web
        # personal en Astro) queda deliberadamente fuera: necesita un build previo
        # y usa el secreto CLOUDFLARE_API_TOKEN a secas, no uno por carpeta.
        # Lo despliega deploy-site.yml.
        run: |
          echo "proyectos=$(find ./projects -name wrangler.jsonc -printf '%h\n' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: descubrir
    if: needs.descubrir.outputs.proyectos != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proyecto: ${{ fromJson(needs.descubrir.outputs.proyectos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: secreto
        run: |
          slug="${{ matrix.proyecto }}"
          slug="${slug#./projects/}"
          echo "clave=CLOUDFLARE_API_TOKEN_$(echo "$slug" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"
      - run: npx wrangler deploy
        working-directory: ${{ matrix.proyecto }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets[steps.secreto.outputs.clave] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
