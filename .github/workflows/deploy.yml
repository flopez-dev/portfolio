name: Deploy landings to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  descubrir:
    runs-on: ubuntu-latest
    outputs:
      proyectos: ${{ steps.matriz.outputs.proyectos }}
    steps:
      - uses: actions/checkout@v4
      - id: matriz
        run: |
          echo "proyectos=$(find . -name wrangler.jsonc -not -path './node_modules/*' -printf '%h\n' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: descubrir
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proyecto: ${{ fromJson(needs.descubrir.outputs.proyectos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy
        working-directory: ${{ matrix.proyecto }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
