name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site (portfolio root + every landing folder)
        run: |
          set -e
          mkdir -p _site
          touch _site/.nojekyll

          # Portfolio root — the gallery at /portfolio/.
          cp index.html _site/
          cp -r css js assets _site/

          # Landings live in the repo under projects/<folder>/, but public URLs stay
          # flat at /portfolio/<slug>/ (matching how this site was structured before
          # the projects/ reorg). The slug is the folder name unless listed here —
          # today only chantal_verdugo_house gets a shorter public slug. Add an entry
          # when a new folder needs one; every other new landing needs no edit here.
          declare -A SLUGS=(
            [chantal_verdugo_house]=chantal-house
          )

          # Every folder under projects/ with its own index.html is published flat
          # at /portfolio/<slug>/, and root index.html's ./projects/<folder>/ links
          # (which is what makes `python3 -m http.server` from the repo root work
          # for local preview, with no build step) are rewritten to ./<slug>/ in
          # this published copy only — the source file keeps the real repo path.
          for dir in projects/*/; do
            name="${dir#projects/}"
            name="${name%/}"
            [ -f "${dir}index.html" ] || continue
            slug="${SLUGS[$name]:-$name}"
            mkdir -p "_site/$slug"
            cp -r "${dir}." "_site/$slug/"
            sed -i \
              -e "s#\./projects/$name/#./$slug/#g" \
              -e "s#>/projects/$name/<#>/$slug/<#g" \
              _site/index.html
          done

          # inmica: client preview only, keep it out of search results. Source files
          # in projects/inmica/ (index, follow + production canonical) are untouched.
          # No robots.txt rewrite here: GitHub Pages only honours robots.txt at the
          # *domain* root (flopez-dev.github.io/robots.txt), which this repo doesn't
          # control, so a per-folder one is inert — the noindex meta above is what
          # actually keeps it out of search results.
          sed -i 's/<meta name="robots" content="index, follow" \/>/<meta name="robots" content="noindex, nofollow" \/>/' "_site/${SLUGS[inmica]:-inmica}/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
