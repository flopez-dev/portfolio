name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site (portfolio root + every landing folder)
        run: |
          set -e
          mkdir -p _site
          touch _site/.nojekyll

          # Portfolio root — the gallery at /portfolio/.
          cp index.html _site/
          cp -r css js assets _site/

          # Every folder under projects/ with its own index.html becomes
          # /portfolio/projects/<name>/. New landings picked up automatically, no
          # workflow edit required.
          for dir in projects/*/; do
            name="${dir#projects/}"
            name="${name%/}"
            [ -f "${dir}index.html" ] || continue
            mkdir -p "_site/projects/$name"
            cp -r "${dir}." "_site/projects/$name/"
          done

          # inmica: client preview only, keep it out of search results. Source files
          # in projects/inmica/ (index, follow + production canonical) are untouched.
          # No robots.txt rewrite here: GitHub Pages only honours robots.txt at the
          # *domain* root (flopez-dev.github.io/robots.txt), which this repo doesn't
          # control, so a per-folder one is inert — the noindex meta above is what
          # actually keeps it out of search results.
          sed -i 's/<meta name="robots" content="index, follow" \/>/<meta name="robots" content="noindex, nofollow" \/>/' _site/projects/inmica/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
