name: Deploy site to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves this repository from /portfolio/, so the artifact is built
      # with a non-root base. `astro build` also copies every landing under
      # projects/ into dist/<slug>/, flat and byte-identical — see
      # integrations/landings.mjs, which owns the slug map and the noindex rule
      # that used to live in this file as bash.
      - run: npm run build
        env:
          SITE_URL: https://flopez-dev.github.io
          BASE_PATH: /portfolio/

      # The artifact deploy does not run Jekyll, but _astro/ would be stripped
      # if it ever did.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
